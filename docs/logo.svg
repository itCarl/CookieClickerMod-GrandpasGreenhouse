<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#141008"/>
  <!-- crest ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#3a2c18" stroke-width="6"/>
  <circle cx="256" cy="256" r="180" fill="#1a1409" stroke="#7c4a27" stroke-width="5"/>
  <!-- leaf ornaments on the ring -->
  <g fill="#4a7c39">
    <path d="M256 58 C 268 70, 268 84, 256 92 C 244 84, 244 70, 256 58 Z"/>
    <path d="M256 454 C 268 442, 268 428, 256 420 C 244 428, 244 442, 256 454 Z"/>
    <path d="M58 256 C 70 244, 84 244, 92 256 C 84 268, 70 268, 58 256 Z"/>
    <path d="M454 256 C 442 244, 428 244, 420 256 C 428 268, 442 268, 454 256 Z"/>
  </g>
  <!-- greenhouse, geometry from Max's draft (gg_garden_assistant_logo.md), scaled 6x -->
