    <path d="M0,12 L0,4" fill="none" stroke="#94cd50" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M0,6 Q-1.5,1.5 -6.5,2 Q-5.5,7 0,6 Z" fill="#94cd50"/>
    <path d="M0,8 Q1.5,3.5 6.5,4 Q5.5,9 0,8 Z" fill="#4a7c39"/>
